version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sopforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sopforge
      POSTGRES_PASSWORD: sopforge_dev_2026
      POSTGRES_DB: sopforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sopforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sopforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
