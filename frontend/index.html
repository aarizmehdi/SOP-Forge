<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SOP Forge — Governed AI engine for internal SOP request processing. Submit, review, and manage organizational requests powered by AI.">
    <title>SOP Forge — Internal SOP AI Agent</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="index.css?v=8">
</head>
<body>
    <!-- ── Login Screen ── -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-brand">
                <div class="brand-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="#18181b" stroke="#27272a"/>
                        <path d="M14 16h20M14 24h16M14 32h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="36" cy="32" r="6" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1.5"/>
                        <path d="M34 32l1.5 1.5L38 31" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="brand-name">SOP Forge</h1>
                <p class="brand-tagline">Governed AI Engine for Internal SOP Processing</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-full">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display:none;">
                        <span class="spinner"></span>
                    </span>
                </button>
                <p id="login-error" class="form-error" style="display:none;"></p>
            </form>

            <div class="login-hint">
                <p>Demo accounts (password: <code>password123</code>):</p>
                <div class="hint-accounts">
                    <button class="hint-chip" data-email="aisha.khan@company.com" onclick="fillLogin(this)">Employee</button>
                    <button class="hint-chip" data-email="bilal.hussain@company.com" onclick="fillLogin(this)">Manager</button>
                    <button class="hint-chip" data-email="tariq.rashid@company.com" onclick="fillLogin(this)">Executive</button>
                    <button class="hint-chip" data-email="nadia.bukhari@company.com" onclick="fillLogin(this)">Admin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Main Application ── -->
    <div id="app-screen" class="screen" style="display:none;">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon-sm">
                    <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="#18181b" stroke="#27272a"/>
                        <path d="M14 16h20M14 24h16M14 32h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="36" cy="32" r="6" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1.5"/>
                        <path d="M34 32l1.5 1.5L38 31" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="sidebar-title">SOP Forge</span>
            </div>

            <div class="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" id="nav-dashboard" data-route="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/chat" class="nav-item" id="nav-chat" data-route="chat">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>AI Assistant</span>
                </a>
                <a href="#/requests" class="nav-item" id="nav-new-request" data-route="requests">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span>My Requests</span>
                </a>
                <a href="#/review" class="nav-item" id="nav-review" data-route="review" style="display:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span>Review</span>
                    <span class="nav-badge" id="review-badge" style="display:none;">0</span>
                </a>
                <a href="#/incidents" class="nav-item" id="nav-incidents" data-route="incidents" style="display:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <span style="color: #ef4444;">Incidents</span>
                </a>
                <a href="#/admin" class="nav-item" id="nav-admin" data-route="admin" style="display:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6M9 15h6"/></svg>
                    <span>SOP Policies</span>
                </a>
                <a href="#/audit" class="nav-item" id="nav-audit" data-route="audit" style="display:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span>Audit Trail</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">AK</div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">User</span>
                        <span class="user-role" id="user-role">Employee</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-icon" title="Sign Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Dynamic content loaded here by router -->
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/RecordRTC/5.6.2/RecordRTC.min.js"></script>
    <script src="js/api.js?v=8"></script>
    <script src="js/auth.js?v=8"></script>
    <script src="js/components/dashboard.js?v=8"></script>
    <script src="js/components/chat-assistant.js?v=8"></script>
    <script src="js/components/request-form.js?v=8"></script>
    <script src="js/components/my-requests.js?v=8"></script>
    <script src="js/components/review-panel.js?v=8"></script>
    <script src="js/components/admin-panel.js?v=8"></script>
    <script src="js/components/audit-viewer.js?v=8"></script>
    <script src="js/components/incidents.js?v=8"></script>
    <script src="js/router.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
